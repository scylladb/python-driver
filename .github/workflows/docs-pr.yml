name: "Docs / Build PR"
# For more information,
# see https://sphinx-theme.scylladb.com/stable/deployment/production.html#available-workflows

permissions:
  contents: read

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - ".github/workflows/docs-*.yml"
      - "cassandra/**"
      - "pyproject.toml"
      - "setup.py"
      - "CHANGELOG.rst"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-*.yml"
      - "cassandra/**"
      - "pyproject.toml"
      - "setup.py"
      - "CHANGELOG.rst"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          working-directory: docs
          enable-cache: true

      - name: Build docs
        id: docs-build
        shell: bash
        run: |
          make -C docs test SPHINXOPTS="-j auto -w $RUNNER_TEMP/docs-warnings.log" \
            2>&1 | tee "$RUNNER_TEMP/docs-build.log"

      - name: Summarize docs diagnostics
        if: always()
        uses: scylladb/sphinx-scylladb-theme/.github/actions/docs-report@0d821fc4038ee9ad6363362c02035132489bf3f6
        with:
          build-outcome: ${{ steps.docs-build.outcome }}
