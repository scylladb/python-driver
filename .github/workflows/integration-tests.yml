name: Integration tests

on:
  push:
    branches:
      - master
      - 'branch-**'
    paths-ignore:
      - docs/**
      - examples/**
      - scripts/**
      - .gitignore
      - '**/*.rst'
      - '**/*.md'
      - '*.ini'
      - LICENSE
      - .github/dependabot.yml
      - .github/pull_request_template.md
      - .github/workflows/docs-*
  pull_request:
    paths-ignore:
      - docs/**
      - examples/**
      - scripts/**
      - .gitignore
      - '**/*.rst'
      - '**/*.md'
      - '*.ini'
      - LICENSE
      - .github/dependabot.yml
      - .github/pull_request_template.md
      - .github/workflows/docs-*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: test ${{ matrix.event_loop_manager }} (${{ matrix.python-version }})
    if: "!contains(github.event.pull_request.labels.*.name, 'disable-integration-tests')"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SCYLLA_VERSION: release:2026.1.13
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
        event_loop_manager: ["libev", "asyncio", "asyncore"]
        exclude:
          - python-version: "3.12"
            event_loop_manager: "asyncore"
          - python-version: "3.13"
            event_loop_manager: "asyncore"
          - python-version: "3.14"
            event_loop_manager: "asyncore"
          - python-version: "3.14t"
            event_loop_manager: "asyncore"
          - python-version: "3.15"
            event_loop_manager: "asyncore"
          - python-version: "3.15t"
            event_loop_manager: "asyncore"

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install libev
      run: sudo apt-get install libev4 libev-dev

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Build driver
      run: uv sync

    - name: Cache Scylla download
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.ccm/scylla-repository
        key: scylla-${{ env.SCYLLA_VERSION }}-${{ runner.os }}
        restore-keys: scylla-${{ env.SCYLLA_VERSION }}-

    - name: Test with pytest
      env:
        EVENT_LOOP_MANAGER: ${{ matrix.event_loop_manager }}
        PROTOCOL_VERSION: 4
      run: |
        if [[ "${{ matrix.python-version }}" =~ t$ ]]; then
          export PYTHON_GIL=0
        fi
        uv run pytest -v tests/integration/standard/ tests/integration/cqlengine/
