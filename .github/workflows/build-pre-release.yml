name: Test building on pre-release python version

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version to run against'
        required: true
        type: string

      target:
        type: string
        description: "JSON array of {os,target} matrix entries"
        default: '[{"os":"ubuntu-24.04","target":"linux"},{"os":"macos-15-intel","target":"macos-x86"},{"os":"macos-14","target":"macos-arm"},{"os":"windows-2022","target":"windows"},{"os":"ubuntu-24.04-arm","target":"linux-aarch64"}]'

jobs:
  build-and-publish:
    uses: ./.github/workflows/lib-build.yml
    with:
      python-version: ${{ inputs.python-version }}
      target: ${{ inputs.target }}
