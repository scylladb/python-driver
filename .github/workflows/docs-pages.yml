name: "Docs / Publish"
# For more information,
# see https://sphinx-theme.scylladb.com/stable/deployment/production.html#available-workflows

permissions:
  contents: write

on:
  push:
    branches:
      - master
      - 'branch-**'
    paths:
      - "docs/**"
      - ".github/workflows/docs-pages.yml"
      - "cassandra/**"
      - "pyproject.toml"
      - "setup.py"
      - "CHANGELOG.rst"
  workflow_dispatch:
  workflow_call:
    inputs:
      release-commit:
        description: Exact signed commit verified by the release workflow
        required: true
        type: string

jobs:
  release:
    if: github.event_name != 'push' || github.actor != 'scylladb-publisher'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-commit || github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: docs
          enable-cache: true

      - name: Build docs
        run: make -C docs multiversion

      - name: Build redirects
        run: make -C docs redirects

      - name: Deploy docs to GitHub Pages
        run: ./docs/_utils/deploy.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
