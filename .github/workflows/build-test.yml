name: Test wheels building

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - docs/**
      - examples/**
      - scripts/**
      - .gitignore
      - '**/*.rst'
      - '**/*.md'
      - '*.ini'
      - LICENSE
      - .github/dependabot.yml
      - .github/pull_request_template.md
      - .github/workflows/docs-*
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  test-wheels-build:
    name: "Test wheels building"
    if: "!contains(github.event.pull_request.labels.*.name, 'disable-test-build')"
    uses: ./.github/workflows/lib-build.yml
    with:
      target: ${{ github.event_name == 'merge_group' && 'linux,linux-aarch64' || 'linux' }}
      smoke_tests: ${{ github.event_name == 'pull_request' }}
