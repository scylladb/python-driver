name: Code coverage

on:
  push:
    branches:
      - master
      - 'branch-**'
    paths-ignore:
      - docs/**
      - examples/**
      - .gitignore
      - '**/*.rst'
      - '**/*.md'
      - '*.ini'
      - LICENSE
      - .github/dependabot.yml
      - .github/pull_request_template.md
      - .github/workflows/docs-*
  pull_request:
    paths-ignore:
      - docs/**
      - examples/**
      - .gitignore
      - '**/*.rst'
      - '**/*.md'
      - '*.ini'
      - LICENSE
      - .github/dependabot.yml
      - .github/pull_request_template.md
      - .github/workflows/docs-*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Measure code coverage
    if: "!contains(github.event.pull_request.labels.*.name, 'disable-coverage-tests')"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SCYLLA_VERSION: release:2026.1.13
      PROTOCOL_VERSION: 4
      # Set once at job level so every step (including "Build driver" and the
      # summary step, both of which invoke `uv run`) sees the same value.
      # uv's cache-keys include this var, so a value that flips between steps
      # makes each `uv run` re-detect a "changed" build config and rebuild the
      # Cython extensions from scratch -- about two minutes wasted per flip.
      CASS_DRIVER_NO_CYTHON: "1"

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install libev
      run: sudo apt-get install libev4 libev-dev

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        python-version: "3.13"
        enable-cache: true

    - name: Build driver
      run: uv sync

    - name: Cache Scylla download
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.ccm/scylla-repository
        key: scylla-${{ env.SCYLLA_VERSION }}-${{ runner.os }}
        restore-keys: scylla-${{ env.SCYLLA_VERSION }}-

    - name: Run tests with coverage
      run: bash scripts/coverage.sh

    - name: Publish coverage summary
      if: always()
      run: |
        {
          echo '## Coverage report'
          echo '```'
          uv run coverage report -m
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-report
        path: |
          htmlcov/
          coverage.xml
