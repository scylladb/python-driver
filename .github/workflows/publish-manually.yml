name: Release ScyllaDB Python Driver
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: New release version, for example 3.29.13 (without -scylla)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: python-driver-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate manual release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check version, dispatch ref and remote state
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/prepare_release.py check

  prepare:
    name: Prepare release candidate as scylladb-releaser
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Mint repository-scoped release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Prepare and push candidate version commit
        id: prepare
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh auth setup-git
          python3 .github/scripts/prepare_release.py prepare

  build-and-publish:
    name: Build and test release distributions
    needs: prepare
    uses: ./.github/workflows/lib-build.yml
    with:
      target_tag: ${{ needs.prepare.outputs.source_sha }}

  pre-release-integration:
    name: Pre-release reactor integration tests
    needs: prepare
    uses: ./.github/workflows/integration-tests.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}

  pre-release-matrix:
    name: Pre-release driver matrix
    needs: prepare
    uses: ./.github/workflows/pre-release-matrix.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}

  finalize:
    name: Publish tested release commit and tag
    needs: [prepare, build-and-publish, pre-release-integration, pre-release-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Mint repository-scoped release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Atomically push version commit and annotated release tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_BUILT_SHA: ${{ needs.build-and-publish.outputs.source_sha }}
        run: |
          gh auth setup-git
          python3 .github/scripts/prepare_release.py finalize

  # Keep this caller path for the existing PyPI Trusted Publisher registration.
  publish:
    name: Publish tested distributions to PyPI
    needs: [finalize, build-and-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-dist
          path: dist
      - name: Reject release filenames already present on PyPI
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/check_pypi_release.py --version "$RELEASE_VERSION" --dist-dir dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: false

  github-release:
    name: Create GitHub release after PyPI publication
    needs: [publish, prepare, build-and-publish]
    uses: ./.github/workflows/github-release.yml
    secrets: inherit
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_sha: ${{ needs.build-and-publish.outputs.source_sha }}
