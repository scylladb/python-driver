name: Build and upload to PyPi manually

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to PyPI'
        type: boolean
        required: false
        default: false

      python-version:
        description: 'Python version to run on'
        type: string
        required: false
        default: "3.13"

      target:
        description: "Comma-separated targets to build for: linux, macos-x86, macos-arm, windows, linux-aarch64"
        type: string
        required: false
        default: "linux,macos-x86,macos-arm,windows,linux-aarch64"

      target_tag:
        description: "Publish particular tag"
        type: string
        required: false
        default: ""

      ignore_tests:
        description: "Don't run tests"
        type: boolean
        required: false
        default: false

jobs:
  prepare-matrix:
    name: "Prepare matrix from target list"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - name: Convert target list to a JSON matrix
        id: prepare
        run: |
          declare -A os_for=(
            [linux]=ubuntu-24.04
            [linux-aarch64]=ubuntu-24.04-arm
            [windows]=windows-2022
            [macos-x86]=macos-15-intel
            [macos-arm]=macos-14
          )
          json="["
          sep=""
          for t in $(echo "${{ inputs.target }}" | tr -d " " | tr "," "\n"); do
            if [[ -z "${os_for[$t]+x}" ]]; then
              echo "::error::Unknown target '$t'. Valid: linux, macos-x86, macos-arm, windows, linux-aarch64" >&2
              exit 1
            fi
            json+="${sep}{\"os\":\"${os_for[$t]}\",\"target\":\"$t\"}"
            sep=","
          done
          json+="]"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  build-and-publish:
    name: "Build wheels"
    needs: prepare-matrix
    uses: ./.github/workflows/lib-build.yml
    with:
      python-version: ${{ inputs.python-version }}
      ignore_tests: ${{ inputs.ignore_tests }}
      target_tag: ${{ inputs.target_tag }}
      target: ${{ needs.prepare-matrix.outputs.matrix }}

  # Publishing is a separate job (not inside the reusable workflow) because PyPI Trusted Publishing
  # requires the *caller* workflow path in the OIDC token. A reusable workflow would embed its own
  # path instead, causing an `invalid-publisher` error on the PyPI side.
  # See: https://github.com/pypa/gh-action-pypi-publish/issues/166
  publish:
    name: "Publish wheels to PyPi"
    needs: build-and-publish
    if: inputs.upload
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          skip-existing: true
